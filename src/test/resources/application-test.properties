# Cấu hình kết nối tới Service Container PostgreSQL trên GitLab CI
# Lưu ý: 'postgres' là alias được định nghĩa trong khối services của .gitlab-ci.yml
spring.datasource.url=jdbc:postgresql://postgres:5432/testdb_ci
spring.datasource.username=postgres_user
spring.datasource.password=postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Tự động tạo và hủy bảng khi hoàn tất test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
